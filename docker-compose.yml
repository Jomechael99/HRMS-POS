version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: .dockerfile
    image: hrms-pos-app
    container_name: hrms_pos_app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/var/www/html
      - ./src/storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:WEQR0a4byw3Z1PE5Og1dWkBwsBEVMeMNFzDnJfButoU=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=HRMS
      - DB_USERNAME=jom
      - DB_PASSWORD=root
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: hrms_pos_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: HRMS
      MYSQL_USER: jom
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
